name: Refresh lock for security branch

on:
  push:
    branches:
      - feat/security-privacy-foundation

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/security-privacy-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock
        run: npm install --package-lock-only

      - name: Commit lock and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-lock-security.yml
          git add package-lock.json package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sincroniza lockfile para Node 22"
          git push origin HEAD:feat/security-privacy-foundation
