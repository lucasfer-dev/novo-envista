name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Scan tracked files for secrets
        run: npm run security:scan

      - name: Regenerate secure dependency lock for auth hotfix branch
        if: github.head_ref == 'fix/auth-email-production-links' && github.actor != 'github-actions[bot]'
        run: npm install next@16.3.4 --save --package-lock-only

      - name: Persist regenerated dependency metadata
        if: github.head_ref == 'fix/auth-email-production-links' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "fix(deps): update Next.js and sharp security chain"
            git push origin HEAD:fix/auth-email-production-links
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
