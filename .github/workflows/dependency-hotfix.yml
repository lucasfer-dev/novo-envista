name: Dependency Hotfix

on:
  push:
    branches:
      - fix/auth-email-production-links
    paths:
      - .github/workflows/dependency-hotfix.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/auth-email-production-links

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Next.js and regenerate lockfile
        run: npm install next@16.3.4 --save --package-lock-only

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(deps): update Next.js and sharp security chain"
          git push origin HEAD:fix/auth-email-production-links
