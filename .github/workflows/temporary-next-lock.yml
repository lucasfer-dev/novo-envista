name: Temporary Next Lock Generator
on:
  push:
    branches:
      - feat/project-creation-progressive-20261027
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Generate updated lockfile
        run: |
          npm install next@16.4.3 --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('node:fs');
          const b64 = fs.readFileSync('package-lock.json').toString('base64');
          for(let i=0; i<b64.length; i+=3000) console.log('LOCKCHUNK '+i+' '+b64.slice(i,i+3000));
          NODE
