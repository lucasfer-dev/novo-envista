name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  critical-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fix/auth-email-production-links

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Pin browser test runner in dependency metadata
        if: github.actor != 'github-actions[bot]'
        run: npm install --save-dev --save-exact --package-lock-only @playwright/test@1.62.1

      - name: Persist pinned browser test runner
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Playwright dependency metadata already pinned."
          else
            git commit -m "test(e2e): pin Playwright runner"
            git push origin HEAD:fix/auth-email-production-links
          fi

      - name: Install application dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          nohup npm run start -- -p 3000 > /tmp/envista-e2e.log 2>&1 &
          echo $! > /tmp/envista-e2e.pid

      - name: Wait for application
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/envista-e2e.log
          exit 1

      - name: Run critical browser journeys
        run: npx playwright test --config=e2e/playwright.config.mjs

      - name: Print server log on failure
        if: failure()
        run: cat /tmp/envista-e2e.log || true
